name: CI Ablation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-ablation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm experiment:ci
      - name: Publish experiment summary
        if: always()
        run: |
          if [ -f coverage/ci-ablation/report.md ]; then
            cat coverage/ci-ablation/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-ablation-${{ github.sha }}
          path: |
            coverage/ci-ablation/report.md
            coverage/ci-ablation/runs.json
            coverage/ci-ablation/*.log
          if-no-files-found: error
          retention-days: 14
