name: Dependency Security

on:
  push:
    branches: [master]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependencies:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Required only for the dependency submission API.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.3.4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Submit resolved runtime and development dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm list -r --json --depth Infinity > "$RUNNER_TEMP/dependencies.json"
          node scripts/security/dependency-snapshot.mjs "$RUNNER_TEMP/dependencies.json" > "$RUNNER_TEMP/snapshot.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input "$RUNNER_TEMP/snapshot.json"
      - name: Audit all dependencies against current advisories
        run: pnpm audit --audit-level high
