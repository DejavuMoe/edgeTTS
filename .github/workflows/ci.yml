name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install exact pnpm 12.3.4
        run: |
          npm install --global pnpm@12.3.4
          node --version
          pnpm --version

      - name: Install workspace dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages & apps
        run: pnpm build

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: ESLint check
        run: pnpm lint

      - name: Run unit & integration test suites
        run: pnpm test

      - name: Prettier formatting check
        run: pnpm format:check

      - name: Git diff & tree cleanliness check
        run: |
          git diff --check
          git diff --exit-code

  docker:
    name: Docker Production Image Contract
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Docker daemon availability
        run: docker version

      - name: Build production Docker image
        run: docker build --tag edgetts:ci .

      - name: Audit Docker image metadata
        run: |
          set -euo pipefail
          echo "Auditing image configuration..."
          USER_CFG=$(docker image inspect edgetts:ci --format '{{.Config.User}}')
          CMD_CFG=$(docker image inspect edgetts:ci --format '{{json .Config.Cmd}}')
          HEALTH_CFG=$(docker image inspect edgetts:ci --format '{{if .Config.Healthcheck}}present{{else}}missing{{end}}')
          ENV_CFG=$(docker image inspect edgetts:ci --format '{{json .Config.Env}}')

          echo "User:        $USER_CFG"
          echo "Cmd:         $CMD_CFG"
          echo "Healthcheck: $HEALTH_CFG"

          if [ "$USER_CFG" != "node" ]; then
            echo "FAIL: Expected Config.User to be 'node', got '$USER_CFG'" >&2
            exit 1
          fi

          if [ "$CMD_CFG" != '["node","dist/server.js"]' ]; then
            echo "FAIL: Expected Config.Cmd to be '[\"node\",\"dist/server.js\"]', got '$CMD_CFG'" >&2
            exit 1
          fi

          if [ "$HEALTH_CFG" != "present" ]; then
            echo "FAIL: Docker healthcheck is missing from image" >&2
            exit 1
          fi

          if echo "$ENV_CFG" | grep -q "API_KEY="; then
            echo "FAIL: Image contains embedded API_KEY secret in environment" >&2
            exit 1
          fi

          echo "PASS: Image metadata audit succeeded."

      - name: Test fail-closed container startup without API key
        run: |
          set -euo pipefail
          echo "Testing fail-closed execution..."
          set +e
          OUTPUT=$(docker run --rm -e REQUIRE_API_KEY=true edgetts:ci 2>&1)
          EXIT_CODE=$?
          set -e

          echo "Exit code: $EXIT_CODE"
          echo "Output: $OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "FAIL: Expected non-zero exit code when REQUIRE_API_KEY=true and API_KEY is missing, got 0" >&2
            exit 1
          fi

          if ! echo "$OUTPUT" | grep -q "API_KEY is required when REQUIRE_API_KEY=true"; then
            echo "FAIL: Expected output to contain 'API_KEY is required when REQUIRE_API_KEY=true'" >&2
            exit 1
          fi

          echo "PASS: Container failed closed with expected message and non-zero exit code."

      - name: Test protected container runtime security and health
        run: |
          set -euo pipefail
          CONTAINER_NAME="edgetts-ci-smoke"
          TEST_PORT=18080
          TEST_KEY="ci-test-api-key-1234567890"

          cleanup() {
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          if (echo > /dev/tcp/127.0.0.1/"$TEST_PORT") 2>/dev/null; then
            echo "FAIL: Port $TEST_PORT is already in use on 127.0.0.1" >&2
            exit 1
          fi

          docker run -d \
            --name "$CONTAINER_NAME" \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp \
            -e REQUIRE_API_KEY=true \
            -e "API_KEY=$TEST_KEY" \
            -p "127.0.0.1:$TEST_PORT:8080" \
            edgetts:ci

          echo "Verifying runtime security posture..."
          READ_ONLY=$(docker inspect "$CONTAINER_NAME" --format '{{.HostConfig.ReadonlyRootfs}}')
          CAP_DROP=$(docker inspect "$CONTAINER_NAME" --format '{{json .HostConfig.CapDrop}}')
          SEC_OPT=$(docker inspect "$CONTAINER_NAME" --format '{{json .HostConfig.SecurityOpt}}')
          CONTAINER_USER=$(docker inspect "$CONTAINER_NAME" --format '{{.Config.User}}')
          DOCKER_SOCK=$(docker inspect "$CONTAINER_NAME" --format '{{json .Mounts}}' | grep -q "docker.sock" && echo "present" || echo "absent")

          if [ "$READ_ONLY" != "true" ]; then
            echo "FAIL: Container rootfs is not read-only" >&2
            exit 1
          fi

          if ! echo "$CAP_DROP" | grep -q "ALL"; then
            echo "FAIL: CapDrop does not contain ALL" >&2
            exit 1
          fi

          if ! echo "$SEC_OPT" | grep -q "no-new-privileges"; then
            echo "FAIL: SecurityOpt does not contain no-new-privileges" >&2
            exit 1
          fi

          if [ "$CONTAINER_USER" != "node" ]; then
            echo "FAIL: Expected container user 'node', got '$CONTAINER_USER'" >&2
            exit 1
          fi

          if [ "$DOCKER_SOCK" != "absent" ]; then
            echo "FAIL: docker.sock mounted inside container" >&2
            exit 1
          fi
          echo "PASS: Runtime security posture verified."

          echo "Polling container health status..."
          HEALTHY=false
          for i in $(seq 1 40); do
            STATUS=$(docker inspect "$CONTAINER_NAME" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')
            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              echo "Container is healthy after attempt $i."
              break
            fi
            sleep 0.5
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "FAIL: Container failed to reach healthy state (last status: $STATUS)" >&2
            docker logs "$CONTAINER_NAME"
            exit 1
          fi

          echo "Verifying HTTP endpoints..."
          HTTP_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$TEST_PORT/health")
          if [ "$HTTP_HEALTH" != "200" ]; then
            echo "FAIL: GET /health returned $HTTP_HEALTH (expected 200)" >&2
            exit 1
          fi

          HTTP_API_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$TEST_PORT/api/health")
          if [ "$HTTP_API_HEALTH" != "200" ]; then
            echo "FAIL: GET /api/health returned $HTTP_API_HEALTH (expected 200)" >&2
            exit 1
          fi

          RESP_UNAUTH=$(curl -s -i "http://127.0.0.1:$TEST_PORT/api/voices")
          if ! echo "$RESP_UNAUTH" | grep -q "HTTP/1.1 401"; then
            echo "FAIL: Unauthenticated GET /api/voices did not return 401" >&2
            exit 1
          fi
          if ! echo "$RESP_UNAUTH" | grep -q '"UNAUTHORIZED"'; then
            echo "FAIL: Error code UNAUTHORIZED missing in 401 response" >&2
            exit 1
          fi

          echo "PASS: Health probes (200) and unauthenticated voice access (401) verified."

  proxy-contract:
    name: Deterministic Nginx Reverse Proxy Contract
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Docker daemon availability
        run: docker version

      - name: Run deterministic Nginx proxy test suite
        run: |
          EDGETTS_NGINX_SKIP_LIVE=1 ./deploy/nginx/test-proxy.sh

  publish:
    name: Publish Multi-Arch Image to GHCR
    needs:
      - quality
      - docker
      - proxy-contract
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: edgetts-ghcr-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag governance
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Validating release tag governance for tag: $TAG"

          # 1. Strict stable SemVer format validation
          if ! echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Release tag '$TAG' does not match strict stable SemVer"
            exit 1
          fi
          echo "PASS: Tag '$TAG' matches strict stable SemVer format."

          # 2. Reject moved release tags (must be new ref creation: event.before all zeros)
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "$ZERO_SHA" ]; then
            echo "::error::existing release tags may not be moved or republished (event.before: $EVENT_BEFORE)"
            exit 1
          fi
          echo "PASS: Tag creation verified (not a moved or republished tag)."

          # 3. Release source must originate from origin/main history
          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            git fetch origin main:refs/remotes/origin/main
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tag target is not reachable from main"
            exit 1
          fi
          echo "PASS: Commit $GITHUB_SHA is an ancestor of origin/main."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/dejavumoe/edgetts
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/DejavuMoe/edgeTTS
            org.opencontainers.image.revision=${{ github.sha }}

      # Security by construction: github.token is used only by docker/login-action
      # for ephemeral registry authentication. It is never passed to Dockerfile
      # as an ARG, ENV, secret mount, or build input.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push multi-arch Docker image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Verify registry manifest and digest resolution
        id: verify-registry
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          echo "Published Digest: $DIGEST"

          # 1. Digest format validation
          if ! echo "$DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "FAIL: Build output digest '$DIGEST' is missing or invalid" >&2
            exit 1
          fi
          echo "PASS: Digest format is valid."

          # 2. Inspect manifest index by digest
          echo "Inspecting OCI manifest index at ghcr.io/dejavumoe/edgetts@${DIGEST}..."
          RAW_INDEX=$(docker buildx imagetools inspect "ghcr.io/dejavumoe/edgetts@${DIGEST}" --raw)
          echo "$RAW_INDEX" | jq .

          # 3. Verify exactly linux/amd64 and linux/arm64 runtime platforms
          RUNTIME_ARCHS=$(echo "$RAW_INDEX" | jq -r '.manifests[] | select(.platform.architecture != "unknown") | "\(.platform.os)/\(.platform.architecture)"' | sort -u)
          echo "Runtime platforms found:"
          echo "$RUNTIME_ARCHS"

          EXPECTED_ARCHS=$(printf "linux/amd64\nlinux/arm64")
          if [ "$RUNTIME_ARCHS" != "$EXPECTED_ARCHS" ]; then
            echo "FAIL: Expected runtime platforms linux/amd64 and linux/arm64, got:" >&2
            echo "$RUNTIME_ARCHS" >&2
            exit 1
          fi
          echo "PASS: Exactly linux/amd64 and linux/arm64 runtime platforms present."

          AMD64_CHILD_DIGEST=$(echo "$RAW_INDEX" | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')
          ARM64_CHILD_DIGEST=$(echo "$RAW_INDEX" | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')

          # 4. Verify BuildKit provenance and SBOM attestations
          echo "Verifying BuildKit provenance and SBOM attestations..."
          ATTESTATION_DIGESTS=$(echo "$RAW_INDEX" | jq -r '.manifests[] | select(.platform.architecture == "unknown") | .digest')
          if [ -z "$ATTESTATION_DIGESTS" ]; then
            echo "FAIL: No attestation manifests found in image index" >&2
            exit 1
          fi

          FOUND_PROVENANCE=false
          FOUND_SBOM=false

          for ADIGEST in $ATTESTATION_DIGESTS; do
            echo "Inspecting attestation descriptor: $ADIGEST"
            AM_RAW=$(docker buildx imagetools inspect "ghcr.io/dejavumoe/edgetts@${ADIGEST}" --raw 2>/dev/null || true)
            echo "$AM_RAW" | jq .

            if echo "$AM_RAW" | grep -Eqi 'slsa|provenance'; then
              FOUND_PROVENANCE=true
              echo "PASS: Provenance predicate detected in $ADIGEST"
            fi
            if echo "$AM_RAW" | grep -Eqi 'spdx|sbom'; then
              FOUND_SBOM=true
              echo "PASS: SBOM predicate detected in $ADIGEST"
            fi
          done

          if [ "$FOUND_PROVENANCE" != "true" ]; then
            echo "FAIL: Provenance attestation predicate missing from registry" >&2
            exit 1
          fi
          if [ "$FOUND_SBOM" != "true" ]; then
            echo "FAIL: SBOM attestation predicate missing from registry" >&2
            exit 1
          fi
          echo "PASS: Both BuildKit provenance and SBOM attestations verified in registry."

          # 5. Verify commit SHA tag resolves to identical digest
          echo "Verifying commit SHA tag resolution..."
          SHA_RAW=$(docker buildx imagetools inspect "ghcr.io/dejavumoe/edgetts:sha-${GITHUB_SHA}" --raw)
          SHA_DIGEST="sha256:$(printf "%s" "$SHA_RAW" | sha256sum | awk '{print $1}')"
          if [ "$SHA_DIGEST" != "$DIGEST" ]; then
            echo "FAIL: sha-${GITHUB_SHA} tag digest $SHA_DIGEST does not match build digest $DIGEST" >&2
            exit 1
          fi
          echo "PASS: Tag sha-${GITHUB_SHA} resolves to exact build digest $DIGEST."

          # 6. Verify main tag resolves to identical digest (when on main branch)
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "Verifying main branch tag resolution..."
            MAIN_RAW=$(docker buildx imagetools inspect "ghcr.io/dejavumoe/edgetts:main" --raw)
            MAIN_DIGEST="sha256:$(printf "%s" "$MAIN_RAW" | sha256sum | awk '{print $1}')"
            if [ "$MAIN_DIGEST" != "$DIGEST" ]; then
              echo "FAIL: main tag digest $MAIN_DIGEST does not match build digest $DIGEST" >&2
              exit 1
            fi
            echo "PASS: Tag main resolves to exact build digest $DIGEST."
          fi

          # 7. Export verified outputs for publication summary
          echo "amd64_digest=$AMD64_CHILD_DIGEST" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=$ARM64_CHILD_DIGEST" >> "$GITHUB_OUTPUT"
          echo "provenance=true" >> "$GITHUB_OUTPUT"
          echo "sbom=true" >> "$GITHUB_OUTPUT"

      - name: Verify multi-arch runtime execution and security posture
        run: |
          set -euo pipefail
          IMAGE_TAG="ghcr.io/dejavumoe/edgetts:sha-${GITHUB_SHA}"

          run_cmd() {
            local desc="$1"
            shift
            echo ">>> RUNNING: $desc"
            local out
            set +e
            out=$("$@" 2>&1)
            local rc=$?
            set -e
            if [ $rc -ne 0 ]; then
              echo "::error::$desc FAILED (rc=$rc): $out"
              echo "$desc FAILED (rc=$rc):" >&2
              echo "$out" >&2
              exit $rc
            fi
            echo ">>> PASS: $desc"
            if [ -n "$out" ]; then
              echo "$out"
            fi
          }

          # 1. Test linux/amd64 runtime
          run_cmd "Pull linux/amd64 image" docker pull --platform linux/amd64 "$IMAGE_TAG"

          run_cmd "Verify linux/amd64 runtime" docker run --rm --platform linux/amd64 "$IMAGE_TAG" node -e '
            const fs = require("node:fs");
            console.log("AMD64 Process Arch:", process.arch);
            if (process.arch !== "x64") {
              console.error("Expected arch x64, got", process.arch);
              process.exit(1);
            }
            if (!fs.existsSync("/app/dist/server.js")) {
              console.error("/app/dist/server.js missing");
              process.exit(1);
            }
            if (!fs.existsSync("/app/web-dist/index.html")) {
              console.error("/app/web-dist/index.html missing");
              process.exit(1);
            }
          '

          AMD64_UID=$(docker run --rm --platform linux/amd64 "$IMAGE_TAG" id -u)
          if [ "$AMD64_UID" -eq 0 ]; then
            echo "::error::linux/amd64 image runs as root (UID 0)"
            exit 1
          fi
          echo "PASS: linux/amd64 UID is $AMD64_UID (non-root)."

          # 2. Test linux/arm64 runtime under QEMU
          run_cmd "Pull linux/arm64 image" docker pull --platform linux/arm64 "$IMAGE_TAG"

          run_cmd "Verify linux/arm64 runtime under QEMU" docker run --rm --platform linux/arm64 "$IMAGE_TAG" node -e '
            const fs = require("node:fs");
            console.log("ARM64 Process Arch:", process.arch);
            if (process.arch !== "arm64") {
              console.error("Expected arch arm64, got", process.arch);
              process.exit(1);
            }
            if (!fs.existsSync("/app/dist/server.js")) {
              console.error("/app/dist/server.js missing");
              process.exit(1);
            }
            if (!fs.existsSync("/app/web-dist/index.html")) {
              console.error("/app/web-dist/index.html missing");
              process.exit(1);
            }
          '

          ARM64_UID=$(docker run --rm --platform linux/arm64 "$IMAGE_TAG" id -u)
          if [ "$ARM64_UID" -eq 0 ]; then
            echo "::error::linux/arm64 image runs as root (UID 0)"
            exit 1
          fi
          echo "PASS: linux/arm64 UID is $ARM64_UID (non-root)."

          # 3. Audit image layer history for credential material
          for PLATFORM in linux/amd64 linux/arm64; do
            run_cmd "Pull $PLATFORM image for history inspection" docker pull --platform "$PLATFORM" "$IMAGE_TAG"
            HISTORY_OUTPUT=$(docker history --no-trunc "$IMAGE_TAG")
            if echo "$HISTORY_OUTPUT" | grep -Eqi 'GITHUB_TOKEN=|GHCR_TOKEN=|API_KEY=[^ $]|Authorization:[[:space:]]*Bearer|ghp_[A-Za-z0-9]|github_pat_[A-Za-z0-9]'; then
              echo "::error::Credential pattern detected in $PLATFORM image history"
              exit 1
            fi
            echo "PASS: $PLATFORM image history clean of credential material."
          done

          # 4. Audit runtime filesystem for prohibited credential/config artifacts
          for PLATFORM in linux/amd64 linux/arm64; do
            run_cmd "Audit $PLATFORM runtime filesystem boundary" docker run --rm --platform "$PLATFORM" "$IMAGE_TAG" node -e '
              const fs = require("node:fs");
              const prohibited = [
                "/root/.docker/config.json",
                "/home/node/.docker/config.json",
                "/.docker/config.json",
                "/root/.docker",
                "/home/node/.docker",
                "/.docker",
                "/app/.env",
                "/app/.env.local",
                "/app/.env.production",
                "/.env",
                "/app/.git",
                "/.git",
                "/root/.npmrc",
                "/home/node/.npmrc",
                "/app/.npmrc"
              ];
              const found = prohibited.filter(p => fs.existsSync(p));
              if (found.length > 0) {
                console.error("Prohibited credential/config artifacts found:", found);
                process.exit(1);
              }
            '
            echo "PASS: $PLATFORM runtime filesystem boundary clean (no credential/config artifacts copied)."
          done

          # 5. Audit runtime container environment for secrets
          for PLATFORM in linux/amd64 linux/arm64; do
            IMAGE_ENV=$(docker run --rm --platform "$PLATFORM" "$IMAGE_TAG" env)
            if echo "$IMAGE_ENV" | grep -Eqi 'API_KEY|GHCR|TOKEN'; then
              echo "::error::Secret found in $PLATFORM image environment"
              exit 1
            fi
            echo "PASS: $PLATFORM runtime environment clean."
          done
          echo "PASS: All published image security and supply-chain audits succeeded."

      - name: Promote verified release candidate to stable SemVer and latest aliases
        id: promote-release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          CANDIDATE_DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE_REPO="ghcr.io/dejavumoe/edgetts"

          inspect_optional() {
            local image="$1" output
            if output=$(docker buildx imagetools inspect "$image" --raw 2>&1); then
              printf '%s' "$output"
              return 0
            fi
            case "$output" in
              *"manifest unknown"*|*"not found"*|*"404"*) return 0 ;;
              *) echo "$output" >&2; return 1 ;;
            esac
          }

          echo "Promoting verified release candidate for version: $VERSION"
          echo "Candidate digest: $CANDIDATE_DIGEST"

          # 1. Promote or verify the exact SemVer release tag (X.Y.Z)
          EXISTING_RAW=$(inspect_optional "${IMAGE_REPO}:${VERSION}")
          if [ -n "$EXISTING_RAW" ]; then
            EXISTING_DIGEST="sha256:$(printf "%s" "$EXISTING_RAW" | sha256sum | awk '{print $1}')"
            echo "Existing tag ${IMAGE_REPO}:${VERSION} resolves to: $EXISTING_DIGEST"
            if [ "$EXISTING_DIGEST" = "$CANDIDATE_DIGEST" ]; then
              echo "Existing version tag resolves to identical verified digest. Permitting idempotent rerun."
            else
              echo "::error::Release version ${VERSION} already points to different content ($EXISTING_DIGEST != $CANDIDATE_DIGEST). Refusing to overwrite existing release."
              exit 1
            fi
          else
            echo "Release version tag ${IMAGE_REPO}:${VERSION} is absent. Promoting from candidate..."
            docker buildx imagetools create \
              --tag "${IMAGE_REPO}:${VERSION}" \
              "${IMAGE_REPO}@${CANDIDATE_DIGEST}"
          fi

          # Verify promoted version tag resolution and attestations
          echo "Verifying ${IMAGE_REPO}:${VERSION} resolution..."
          VER_RAW=$(docker buildx imagetools inspect "${IMAGE_REPO}:${VERSION}" --raw)
          VER_DIGEST="sha256:$(printf "%s" "$VER_RAW" | sha256sum | awk '{print $1}')"
          if [ "$VER_DIGEST" != "$CANDIDATE_DIGEST" ]; then
            echo "::error::Version tag ${VERSION} digest $VER_DIGEST does not match verified digest $CANDIDATE_DIGEST"
            exit 1
          fi
          echo "PASS: Tag ${VERSION} resolves to exact verified digest $CANDIDATE_DIGEST."

          PROMOTED_INDEX=$(docker buildx imagetools inspect "${IMAGE_REPO}:${VERSION}" --raw)
          PROMOTED_ARCHS=$(echo "$PROMOTED_INDEX" | jq -r '.manifests[] | select(.platform.architecture != "unknown") | "\(.platform.os)/\(.platform.architecture)"' | sort -u)
          EXPECTED_ARCHS=$(printf "linux/amd64\nlinux/arm64")
          if [ "$PROMOTED_ARCHS" != "$EXPECTED_ARCHS" ]; then
            echo "::error::Promoted version platforms do not match expected linux/amd64 and linux/arm64"
            exit 1
          fi

          PROMOTED_ATTESTATIONS=$(echo "$PROMOTED_INDEX" | jq -r '.manifests[] | select(.platform.architecture == "unknown") | .digest')
          if [ -z "$PROMOTED_ATTESTATIONS" ]; then
            echo "::error::Promoted version is missing attestation manifests"
            exit 1
          fi
          echo "PASS: Multi-arch platforms and attestations preserved on version tag ${VERSION}."

          # 2. Determine highest successfully published stable SemVer release
          git fetch --tags origin --quiet
          CANDIDATE_VERSIONS=$(git tag -l "v*" | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sed 's/^v//' | sort -V -r || true)
          ALL_VERSIONS=$(printf "%s\n%s\n" "$VERSION" "$CANDIDATE_VERSIONS" | sed '/^$/d' | sort -u | sort -V -r)

          HIGHEST_PUBLISHED_VERSION=""
          HIGHEST_PUBLISHED_DIGEST=""

          for V in $ALL_VERSIONS; do
            V_RAW=$(inspect_optional "${IMAGE_REPO}:${V}")
            if [ -n "$V_RAW" ]; then
              HIGHEST_PUBLISHED_VERSION="$V"
              HIGHEST_PUBLISHED_DIGEST="sha256:$(printf "%s" "$V_RAW" | sha256sum | awk '{print $1}')"
              break
            fi
          done

          if [ -z "$HIGHEST_PUBLISHED_VERSION" ]; then
            echo "::error::Failed to determine highest published version (expected at least $VERSION)"
            exit 1
          fi

          echo "Current release version:     $VERSION"
          echo "Highest published version:   $HIGHEST_PUBLISHED_VERSION"
          echo "Highest published digest:    $HIGHEST_PUBLISHED_DIGEST"

          LATEST_UPDATED="false"
          if [ "$VERSION" = "$HIGHEST_PUBLISHED_VERSION" ]; then
            echo "Current release $VERSION is the highest published stable version. Promoting latest alias..."
            docker buildx imagetools create \
              --tag "${IMAGE_REPO}:latest" \
              "${IMAGE_REPO}@${CANDIDATE_DIGEST}"

            LATEST_RAW=$(docker buildx imagetools inspect "${IMAGE_REPO}:latest" --raw)
            LATEST_DIGEST="sha256:$(printf "%s" "$LATEST_RAW" | sha256sum | awk '{print $1}')"
            if [ "$LATEST_DIGEST" != "$CANDIDATE_DIGEST" ]; then
              echo "::error::Promoted latest tag digest $LATEST_DIGEST does not match verified digest $CANDIDATE_DIGEST"
              exit 1
            fi
            LATEST_UPDATED="true"
            echo "PASS: Tag latest promoted to $VERSION ($CANDIDATE_DIGEST)."
          else
            echo "Current release $VERSION is lower than highest published version $HIGHEST_PUBLISHED_VERSION."
            echo "latest alias will NOT be modified; it remains owned by $HIGHEST_PUBLISHED_VERSION."

            LATEST_RAW=$(inspect_optional "${IMAGE_REPO}:latest")
            if [ -n "$LATEST_RAW" ]; then
              LATEST_DIGEST="sha256:$(printf "%s" "$LATEST_RAW" | sha256sum | awk '{print $1}')"
              if [ "$LATEST_DIGEST" = "$CANDIDATE_DIGEST" ]; then
                echo "::error::Governance drift: latest incorrectly resolves to lower candidate digest ($CANDIDATE_DIGEST)"
                exit 1
              fi
              if [ "$LATEST_DIGEST" != "$HIGHEST_PUBLISHED_DIGEST" ]; then
                echo "::error::Governance drift: latest digest ($LATEST_DIGEST) does not match highest published version ($HIGHEST_PUBLISHED_VERSION) digest ($HIGHEST_PUBLISHED_DIGEST)"
                exit 1
              fi
              echo "PASS: latest verified to resolve to highest published version $HIGHEST_PUBLISHED_VERSION ($HIGHEST_PUBLISHED_DIGEST)."
            else
              echo "::warning::latest tag is absent from registry; leaving uncreated because current release is not highest."
            fi
          fi

          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "highest_published_version=$HIGHEST_PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_updated=$LATEST_UPDATED" >> "$GITHUB_OUTPUT"
          echo "latest_target=$HIGHEST_PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release publication summary
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          AMD64_DIGEST="${{ steps.verify-registry.outputs.amd64_digest }}"
          ARM64_DIGEST="${{ steps.verify-registry.outputs.arm64_digest }}"
          HAS_PROV="${{ steps.verify-registry.outputs.provenance }}"
          HAS_SBOM="${{ steps.verify-registry.outputs.sbom }}"

          {
            echo "## Publication Summary"
            echo ""
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| **Event** | \`${{ github.event_name }}\` |"
            echo "| **Ref** | \`${{ github.ref }}\` |"
            echo "| **Git Commit SHA** | \`${{ github.sha }}\` |"
            echo "| **OCI Index Digest** | \`${DIGEST}\` |"
            echo "| **linux/amd64 Manifest** | \`${AMD64_DIGEST}\` |"
            echo "| **linux/arm64 Manifest** | \`${ARM64_DIGEST}\` |"
            echo "| **SLSA Provenance** | \`${HAS_PROV}\` |"
            echo "| **SPDX SBOM** | \`${HAS_SBOM}\` |"
            echo "| **Candidate Ref** | \`ghcr.io/dejavumoe/edgetts:sha-${{ github.sha }}\` |"

            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "| **Branch Snapshot Ref** | \`ghcr.io/dejavumoe/edgetts:main\` |"
            elif echo "${GITHUB_REF}" | grep -q '^refs/tags/v'; then
              RELEASE_VER="${{ steps.promote-release.outputs.release_version }}"
              HIGHEST_VER="${{ steps.promote-release.outputs.highest_published_version }}"
              LATEST_UPD="${{ steps.promote-release.outputs.latest_updated }}"
              LATEST_TGT="${{ steps.promote-release.outputs.latest_target }}"

              echo "| **Release Version** | \`${RELEASE_VER}\` |"
              echo "| **Highest Published Stable Version** | \`${HIGHEST_VER}\` |"
              echo "| **latest Updated** | \`${LATEST_UPD}\` |"
              echo "| **latest Target** | \`${LATEST_TGT}\` |"
              echo "| **Release Version Ref** | \`ghcr.io/dejavumoe/edgetts:${RELEASE_VER}\` |"
              echo "| **Latest Release Alias** | \`ghcr.io/dejavumoe/edgetts:latest\` |"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
